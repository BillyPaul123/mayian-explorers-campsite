<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Mayian Explorers Campsite emblem">
  <defs>
    <path id="arcTop" d="M 14 60 A 46 46 0 0 1 106 60"/>
    <path id="arcBottom" d="M 14 60 A 46 46 0 0 0 106 60"/>
  </defs>

  <g fill="none" stroke="#000" stroke-width="1.05">
    <circle cx="60" cy="60" r="57.2"/>
    <circle cx="60" cy="60" r="52.6" stroke-width=".5"/>
  </g>

  <g fill="#000" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6.4" font-weight="500" letter-spacing="1.55" text-anchor="middle">
    <text><textPath href="#arcTop" startOffset="50%">MAYIAN EXPLORERS CAMP</textPath></text>
    <text><textPath href="#arcBottom" startOffset="50%">SAMBURU</textPath></text>
  </g>

  <!-- bird in flight -->
  <g fill="none" stroke="#000" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 52.5 35.4c 2.4-2.2 5.1-2.2 7.5 0 2.4-2.2 5.1-2.2 7.5 0"/>
    <path d="M 54.6 33.2c 1.6-1.3 3.4-2.4 5.4-3.4 2 1 3.8 2.1 5.4 3.4"/>
  </g>

  <!-- acacia, drawn as linework -->
  <g fill="none" stroke="#000" stroke-width=".85" stroke-linecap="round" stroke-linejoin="round">
    <!-- trunk -->
    <path d="M 60 72V 61"/>
    <!-- branches fanning into the canopy -->
    <path d="M 60 61 46 55.6M 60 61 54 56.4M 60 61 66 56.4M 60 61 74 55.6" stroke-width=".6" opacity=".85"/>
    <!-- umbrella canopy: top arc + underside arc -->
    <path d="M 37 54Q 60 40 83 54"/>
    <path d="M 37 54Q 60 59 83 54" stroke-width=".6" opacity=".85"/>
  </g>

  <!-- ground -->
  <g fill="none" stroke="#000" stroke-width=".7" stroke-linecap="round" opacity=".8">
    <path d="M 43 74h 34"/>
    <path d="M 45.5 74c-.9-1.1-1.6-2.2-2.1-3.3M 74.5 74c.9-1.1 1.6-2.2 2.1-3.3"/>
  </g>

  <!-- compass rose -->
  <g fill="none" stroke="#000" stroke-width=".7">
    <circle cx="60" cy="86" r="4.2"/>
    <path d="M 60 80.6v 1.5M 60 89.9v 1.5M 55.1 86h 1.5M 63.4 86h 1.5"/>
  </g>
  <path d="M 60 82.1l 1.4 3-1.4 3.8-1.4-3.8z" fill="#000"/>
  <path d="M 60 82.1l 1.4 3h-2.8z" fill="#000"/>
</svg>
